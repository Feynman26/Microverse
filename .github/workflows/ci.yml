name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine
        run: godot --version

      - name: Parse project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-parse.log; then
            echo "Godot parser diagnostics detected."
            exit 1
          fi

      - name: Run invariant suite
        run: godot --headless --path . --script tests/run_tests.gd

      - name: Validate deterministic RNG stream locality
        run: godot --headless --path . --script tests/rng_stream_tests.gd

      - name: Characterize M4 catalytic landscape
        run: godot --headless --path . --script tests/m4_landscape_tests.gd

      - name: Validate M4 metabolic integration
        run: godot --headless --path . --script tests/m4_metabolism_tests.gd

      - name: Validate M5 explicit expression core
        run: godot --headless --path . --script tests/m5_expression_tests.gd

      - name: Validate M5-B regulation and sensing
        run: godot --headless --path . --script tests/m5_regulation_tests.gd

      - name: Validate M5 finite proteome budget
        run: godot --headless --path . --script tests/m5_proteome_tests.gd

      - name: Validate M5 shared translation capacity
        run: godot --headless --path . --script tests/m5_translation_capacity_tests.gd

      - name: Preserve M5-C ROS circuit mechanics gate
        run: godot --headless --path . --script tests/m5c_ros_circuit_tests.gd

      - name: Validate M5-C expression-burden mechanics
        run: godot --headless --path . --script tests/m5c_burden_mechanics_tests.gd

      - name: Validate M6 physical-cell mechanics
        run: godot --headless --path . --script tests/m6_mechanics_tests.gd

      - name: Validate M6 spatial broad phase
        run: godot --headless --path . --script tests/m6_spatial_index_tests.gd

      - name: Validate M6 spatial ecology
        run: godot --headless --path . --script tests/m6_spatial_ecology_tests.gd

      - name: Validate M7 extracellular substrate
        run: godot --headless --path . --script tests/m7_extracellular_tests.gd

      - name: Validate M7 generic membrane transport
        run: godot --headless --path . --script tests/m7_membrane_transport_tests.gd

      - name: Validate M7 one-way cross-feeding
        run: godot --headless --path . --script tests/m7_cross_feeding_tests.gd

      - name: Validate M7 reciprocal cross-feeding
        run: godot --headless --path . --script tests/m7_reciprocal_cross_feeding_tests.gd

      - name: Validate M7 extracellular public good and exploitation
        run: godot --headless --path . --script tests/m7_public_good_tests.gd

      - name: Validate M7 neighborhood detoxification
        run: godot --headless --path . --script tests/m7_detoxification_tests.gd

      - name: Validate compact M7 closure bundle
        run: godot --headless --path . --script tests/m7_closure_tests.gd

      - name: Validate M8 experiment runner and environment schedules
        run: godot --headless --path . --script tests/m8_runner_tests.gd

      - name: Validate compact M8 environment and analytics closure
        run: godot --headless --path . --script tests/m8_completion_tests.gd

      - name: Execute frozen M8 regulatory confirmation panel
        run: godot --headless --path . --script tests/m8_regulatory_confirmation_tests.gd

      - name: Validate compact M9 exact causal laboratory
        run: godot --headless --path . --script tests/m9_causal_lab_tests.gd
