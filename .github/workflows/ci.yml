name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine
        run: godot --version

      - name: Parse project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-parse.log; then
            echo "Godot parser diagnostics detected."
            exit 1
          fi

      - name: Run invariant suite
        run: godot --headless --path . --script tests/run_tests.gd

      - name: Characterize M4 catalytic landscape
        run: godot --headless --path . --script tests/m4_landscape_tests.gd

      - name: Validate M4 metabolic integration
        run: godot --headless --path . --script tests/m4_metabolism_tests.gd

      - name: Validate M5 explicit expression core
        run: godot --headless --path . --script tests/m5_expression_tests.gd

      - name: Validate M5-B regulation and sensing
        run: godot --headless --path . --script tests/m5_regulation_tests.gd

      - name: Validate M5-C environment-dependent regulatory selection
        run: godot --headless --path . --script tests/m5c_timescale_confirmation.gd
