name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine
        run: godot --version

      - name: Parse project headlessly
        run: godot --headless --editor --path . --quit

      - name: Run invariant suite
        run: godot --headless --path . --script tests/run_tests.gd
